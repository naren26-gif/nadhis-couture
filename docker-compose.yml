# Two containers: the app (not reachable from outside) and Caddy (the only thing that listens on 80/443 and gets the
# free HTTPS certificate). All settings come from an env file; its path is NADHI_ENV_FILE (default ./.env).
#   On the server:  deploy/deploy.sh   (uses /etc/nadhi/env)
#   On your PC:     see docs/DEPLOY_AWS.md, "Try it on your PC first"
services:
  app:
    build: .
    env_file: ${NADHI_ENV_FILE:-.env}
    restart: unless-stopped
    expose:
      - "3000"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN, for example app.example.com}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  caddy_data:
  caddy_config:
